services:
  app:
    image: educoder-tools:${APP_VERSION:?Set APP_VERSION from VERSION}
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
    restart: unless-stopped
    init: true
    ports:
      - "11454:11454"
    environment:
      HTTP_ADDR: "0.0.0.0:11454"
      WEB_STATIC_DIR: "/app/web"
      SESSION_TTL: "8h"
      WEB_COOKIE_SECURE: "${WEB_COOKIE_SECURE:-true}"
      WEB_ORIGIN: "${WEB_ORIGIN:-https://touge.mom}"
      PLATFORM_ADMIN_USER_IDS: "${PLATFORM_ADMIN_USER_IDS:-}"
      ACCESS_CARD_REQUIRED: "${ACCESS_CARD_REQUIRED:-false}"
      APP_DATA_DIR: "/data"
      JOB_WORKERS: "${JOB_WORKERS:-16}"
      JOB_QUEUE_SIZE: "${JOB_QUEUE_SIZE:-256}"
      JOB_PER_ACCOUNT_PENDING: "${JOB_PER_ACCOUNT_PENDING:-16}"
      JOB_PER_ACCOUNT_RUNNING: "${JOB_PER_ACCOUNT_RUNNING:-4}"
      JOB_TIMEOUT: "${JOB_TIMEOUT:-30m}"
      MODEL_CONCURRENCY: "${MODEL_CONCURRENCY:-8}"
      MODEL_TIMEOUT: "${MODEL_TIMEOUT:-2m}"
      DEEPSEEK_API_KEY_FILE: "/run/secrets/deepseek_api_key"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-}"
    volumes:
      - app-data:/data
    secrets:
      - deepseek_api_key
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:

secrets:
  deepseek_api_key:
    file: ${DEEPSEEK_SECRET_FILE:-./deploy/secrets/deepseek_api_key}
